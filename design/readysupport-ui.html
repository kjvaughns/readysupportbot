<title>ReadySupport Control Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ==========================================================================
   ReadySupport — design tokens

   Single visual world on purpose: this is a light operations console, and the
   brand pins white and very light grey as the ground. Every colour is painted
   explicitly so the page holds on any host background.
   ========================================================================== */
:root {
  /* Brand */
  --brand:        #6D5DFB;
  --brand-press:  #5B4BE0;
  --brand-tint:   #F1EFFE;
  --brand-tint-2: #E6E2FD;
  --brand-line:   #D5CFFB;

  /* Ground and ink. Neutrals lean cool to sit with the violet rather than
     fight it — a warm grey next to #6D5DFB reads as an accident. */
  --bg:           #F7F7F8;
  --surface:      #FFFFFF;
  --surface-2:    #FAFAFB;
  --surface-3:    #F4F4F5;
  --border:       #E5E7EB;
  --border-strong:#D4D4D8;

  --ink:          #18181B;
  --ink-2:        #3F3F46;
  --ink-3:        #71717A;
  --ink-4:        #A1A1AA;

  /* State. Kept separate from the accent: purple never means "good". */
  --ok:           #16A34A;
  --ok-tint:      #ECFDF3;
  --ok-line:      #BBF7D0;
  --warn:         #D97706;
  --warn-tint:    #FFFBEB;
  --warn-line:    #FDE68A;
  --danger:       #DC2626;
  --danger-tint:  #FEF2F2;
  --danger-line:  #FECACA;

  /* Elevation — barely there. Borders do the separating. */
  --shadow-sm: 0 1px 2px rgba(24,24,27,.04);
  --shadow:    0 1px 2px rgba(24,24,27,.04), 0 1px 3px rgba(24,24,27,.06);
  --shadow-lg: 0 4px 6px -2px rgba(24,24,27,.04), 0 12px 24px -6px rgba(24,24,27,.10);
  --shadow-xl: 0 8px 12px -4px rgba(24,24,27,.06), 0 24px 48px -12px rgba(24,24,27,.16);

  --r-sm: 6px;
  --r:    8px;
  --r-md: 10px;
  --r-lg: 14px;

  /* Inter and Geist are requested first; the system grotesques are the
     closest fallbacks when neither is installed. */
  --font: "Inter", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono",
          Menlo, Consolas, monospace;

  --sidebar-w: 248px;
  --topbar-h: 60px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv05" 1, "ss01" 1;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.014em; text-wrap: balance; }
h1 { font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
h2 { font-size: 15px; line-height: 1.35; }
h3 { font-size: 14px; }
p  { margin: 0; }
a  { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

::selection { background: var(--brand-tint-2); }

/* --------------------------------------------------------------------------
   Primitives
   -------------------------------------------------------------------------- */

.muted   { color: var(--ink-3); }
.dim     { color: var(--ink-4); }
.strong  { color: var(--ink); font-weight: 500; }
.nums    { font-variant-numeric: tabular-nums; }
.tiny    { font-size: 12px; }
.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-4);
}
.stack   { display: flex; flex-direction: column; }
.row     { display: flex; align-items: center; }
.gap-2 { gap: 2px; }  .gap-4 { gap: 4px; }  .gap-5 { gap: 5px; }
.gap-6 { gap: 6px; }  .gap-7 { gap: 7px; }  .gap-8 { gap: 8px; }
.gap-9 { gap: 9px; }  .gap-10{ gap: 10px; } .gap-12{ gap: 12px; }
.gap-14{ gap: 14px; } .gap-16{ gap: 16px; } .gap-18{ gap: 18px; }
.gap-20{ gap: 20px; } .gap-24{ gap: 24px; }
.between { justify-content: space-between; }
.wrap    { flex-wrap: wrap; }
.grow    { flex: 1 1 auto; min-width: 0; }
.truncate{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden  { display: none !important; }

/* Request identifiers are the spine of the product: every action is traceable
   by one. They get a consistent, deliberately object-like treatment. */
.rid {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--brand);
  background: var(--brand-tint);
  border: 1px solid var(--brand-line);
  border-radius: var(--r-sm);
  padding: 1px 6px;
  white-space: nowrap;
}
.rid.plain { color: var(--ink-3); background: var(--surface-3); border-color: var(--border); }

.mono { font-family: var(--mono); font-size: 12.5px; }

/* Buttons ------------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 13px;
  border: 1px solid var(--border); border-radius: var(--r);
  background: var(--surface); color: var(--ink);
  font-size: 13.5px; font-weight: 500; letter-spacing: -0.005em;
  cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: background .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active:not(:disabled) { background: var(--surface-3); }
.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn svg { width: 15px; height: 15px; flex: none; }

.btn.primary {
  background: var(--brand); border-color: var(--brand); color: #fff;
  box-shadow: 0 1px 2px rgba(109,93,251,.28);
}
.btn.primary:hover:not(:disabled) { background: var(--brand-press); border-color: var(--brand-press); }
.btn.primary:active:not(:disabled) { background: var(--brand-press); }

.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 1px 2px rgba(220,38,38,.24); }
.btn.danger:hover:not(:disabled) { background: #B91C1C; border-color: #B91C1C; }

.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-3); border-color: transparent; }

.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: var(--r-sm); }
.btn.sm svg { width: 13px; height: 13px; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn.block { width: 100%; }
.btn.icon { width: 30px; height: 30px; padding: 0; }
.btn.icon.sm { width: 26px; height: 26px; }

/* Cards -------------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.card-body { padding: 16px; }
.card-body.tight { padding: 12px 16px; }
.card-foot { padding: 11px 16px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }

/* Status pills ------------------------------------------------------------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 9px 0 7px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 12px; font-weight: 500; letter-spacing: -0.005em;
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: currentColor; }
.pill.neutral { background: var(--surface-3); border-color: var(--border); color: var(--ink-3); }
.pill.brand   { background: var(--brand-tint); border-color: var(--brand-line); color: var(--brand-press); }
.pill.ok      { background: var(--ok-tint); border-color: var(--ok-line); color: #15803D; }
.pill.warn    { background: var(--warn-tint); border-color: var(--warn-line); color: #B45309; }
.pill.danger  { background: var(--danger-tint); border-color: var(--danger-line); color: #B91C1C; }

/* A running job is the one place motion earns its keep. */
.pill.running .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* Encodes the thing the product cares about most: does this change an account?
   Used on quick actions, table rows and the activity log, consistently. */
.kind { width: 6px; height: 6px; border-radius: 999px; flex: none; }
.kind.read    { background: var(--ink-4); }
.kind.write   { background: var(--brand); }
.kind.destroy { background: var(--danger); }

/* Tables ------------------------------------------------------------------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th {
  text-align: left; font-weight: 500; font-size: 11.5px; letter-spacing: .04em;
  text-transform: uppercase; color: var(--ink-4);
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); white-space: nowrap;
}
table.tbl th:first-child { border-top-left-radius: var(--r-lg); }
table.tbl th:last-child  { border-top-right-radius: var(--r-lg); }
table.tbl td {
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  vertical-align: middle; white-space: nowrap;
}
table.tbl tbody tr:last-child td { border-bottom: none; }
table.tbl tbody tr.clickable { cursor: pointer; }
table.tbl tbody tr.clickable:hover { background: var(--surface-2); }
table.tbl td.wide { white-space: normal; min-width: 200px; }

.avatar {
  width: 26px; height: 26px; border-radius: 999px; flex: none;
  display: grid; place-items: center;
  background: var(--brand-tint); color: var(--brand-press);
  font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
  border: 1px solid var(--brand-line);
}
.avatar.lg { width: 44px; height: 44px; font-size: 15px; }
.avatar.grey { background: var(--surface-3); color: var(--ink-3); border-color: var(--border); }

/* Forms -------------------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.hint  { font-size: 12px; color: var(--ink-3); }
.input, .select, .textarea {
  width: 100%; height: 36px; padding: 0 11px;
  background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r);
  font-size: 13.5px; color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: border-color .12s ease, box-shadow .12s ease;
}
.textarea { height: auto; padding: 10px 11px; resize: vertical; line-height: 1.55; }
.input::placeholder, .textarea::placeholder { color: var(--ink-4); }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(109,93,251,.14);
}
.select {
  appearance: none; padding-right: 30px; cursor: pointer;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 9px center;
}
.search { position: relative; }
.search .input { padding-left: 32px; }
.search svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--ink-4); pointer-events: none;
}

.switch {
  position: relative; width: 36px; height: 21px; flex: none;
  background: var(--border-strong); border-radius: 999px; cursor: pointer;
  border: none; padding: 0; transition: background .15s ease;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 17px; height: 17px; border-radius: 999px; background: #fff;
  box-shadow: var(--shadow-sm); transition: transform .15s ease;
}
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(15px); }

/* Meters ------------------------------------------------------------------- */
.meter { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; display: flex; }
.meter span { display: block; height: 100%; }
.meter .used  { background: var(--brand); }
.meter .idle  { background: var(--brand-line); }

/* Layout ------------------------------------------------------------------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w); flex: none;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand-mark {
  display: flex; align-items: center; gap: 9px;
  padding: 16px 16px 14px;
}
.logo {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: var(--brand); display: grid; place-items: center;
  box-shadow: 0 1px 2px rgba(109,93,251,.35);
}
.logo svg { width: 16px; height: 16px; color: #fff; }
.brand-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.02em; }
.brand-sub  { font-size: 11px; color: var(--ink-4); margin-top: -2px; }

.nav { padding: 4px 10px; display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  height: 32px; padding: 0 9px; border-radius: var(--r);
  color: var(--ink-2); font-size: 13.5px; font-weight: 500;
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  transition: background .1s ease, color .1s ease;
}
.nav-item svg { width: 16px; height: 16px; flex: none; color: var(--ink-4); }
.nav-item:hover { background: var(--surface-3); }
.nav-item.active { background: var(--brand-tint); color: var(--brand-press); }
.nav-item.active svg { color: var(--brand); }
.nav-count {
  margin-left: auto; font-size: 11.5px; font-weight: 600;
  color: var(--ink-3); background: var(--surface-3);
  border-radius: 999px; padding: 1px 7px; min-width: 20px; text-align: center;
}
.nav-item.active .nav-count { background: #fff; color: var(--brand-press); }
.nav-count.attention { background: var(--warn-tint); color: #B45309; }

.side-foot { border-top: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.org-chip {
  display: flex; align-items: center; gap: 9px; padding: 8px 9px;
  border-radius: var(--r); cursor: pointer; border: none; background: none;
  width: 100%; text-align: left;
}
.org-chip:hover { background: var(--surface-3); }
/* Without this the inline SVG inherits no size and renders enormous. */
.org-chip > svg { width: 15px; height: 15px; flex: none; color: var(--ink-4); }
.org-logo {
  width: 24px; height: 24px; border-radius: 6px; flex: none;
  background: var(--ink); color: #fff; display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
}

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: 12px;
  padding: 0 24px;
  background: rgba(255,255,255,.85);
  backdrop-filter: saturate(1.5) blur(8px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 30;
}
.crumb { font-size: 13.5px; color: var(--ink-3); }
.crumb b { color: var(--ink); font-weight: 500; }

.content { padding: 24px; max-width: 1360px; width: 100%; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head .sub { color: var(--ink-3); font-size: 13.5px; margin-top: 3px; }

.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
/* Cards size to their content rather than stretching to match the tallest
   column, which otherwise leaves a dead white block under short lists. */
.g-2-1 { grid-template-columns: minmax(0,2fr) minmax(0,1fr); align-items: start; }

/* Settings puts its section list beside the panel. Declared here rather than
   inline so the narrow-screen rule below can actually win. */
.settings-grid { grid-template-columns: 210px minmax(0,1fr); gap: 20px; }

/* Connection card — the one thing that must never be missable. The state rail
   carries the status in form as well as colour. */
.conn {
  position: relative; overflow: hidden;
  padding-left: 20px;
}
.conn::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--ok);
}
.conn.warn::before   { background: var(--warn); }
.conn.danger::before { background: var(--danger); }

.status-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; background: var(--ok); }
.status-dot.warn { background: var(--warn); }
.status-dot.danger { background: var(--danger); }
.status-dot.ring { box-shadow: 0 0 0 3px var(--ok-tint); }
.status-dot.warn.ring { box-shadow: 0 0 0 3px var(--warn-tint); }
.status-dot.danger.ring { box-shadow: 0 0 0 3px var(--danger-tint); }

/* Stat cards --------------------------------------------------------------- */
.stat { padding: 15px 16px; }
.stat .k { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.stat .v { font-size: 27px; font-weight: 600; letter-spacing: -0.03em; margin-top: 5px; line-height: 1.1; }
.stat .m { font-size: 12px; color: var(--ink-4); margin-top: 4px; }

/* Lists -------------------------------------------------------------------- */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
  font-size: 13.5px;
}
.list-row:last-child { border-bottom: none; }
.list-row.clickable { cursor: pointer; }
.list-row.clickable:hover { background: var(--surface-2); }

/* Alerts ------------------------------------------------------------------- */
.alert {
  display: flex; gap: 11px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2); font-size: 13px;
}
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.alert.warn   { background: var(--warn-tint); border-color: var(--warn-line); color: #92400E; }
.alert.warn svg { color: var(--warn); }
.alert.danger { background: var(--danger-tint); border-color: var(--danger-line); color: #991B1B; }
.alert.danger svg { color: var(--danger); }
.alert.ok     { background: var(--ok-tint); border-color: var(--ok-line); color: #14532D; }
.alert.ok svg { color: var(--ok); }
.alert.brand  { background: var(--brand-tint); border-color: var(--brand-line); color: #4C3FCC; }
.alert.brand svg { color: var(--brand); }
.alert b { font-weight: 600; }

/* Overlays ----------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(24,24,27,.32);
  backdrop-filter: blur(2px);
  display: grid; place-items: start center;
  padding: 8vh 20px 20px;
  overflow-y: auto;
  animation: fade .12s ease-out;
}
.scrim.center { place-items: center; padding: 20px; }
@keyframes fade { from { opacity: 0; } }

.modal {
  width: 100%; max-width: 560px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-xl);
  animation: rise .14s cubic-bezier(.2,.8,.3,1);
}
.modal.wide { max-width: 680px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.99); } }
.modal-head { padding: 18px 20px 0; }
.modal-body { padding: 18px 20px; }
.modal-foot {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 14px 20px; border-top: 1px solid var(--border);
  background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg);
}
.modal-foot.split { justify-content: space-between; }

.panel-scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24,24,27,.28);
  animation: fade .12s ease-out;
}
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 95;
  width: min(560px, 100%);
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-xl);
  display: flex; flex-direction: column;
  animation: slide .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes slide { from { transform: translateX(16px); opacity: .6; } }
.panel-head { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.panel-body { padding: 20px; overflow-y: auto; flex: 1 1 auto; }
.panel-foot { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2); }

/* Definition rows ---------------------------------------------------------- */
/* Wide enough that "Last successful sign-in" stays on one line. */
.defs { display: grid; grid-template-columns: 168px minmax(0,1fr); gap: 9px 16px; font-size: 13.5px; }
.defs dt { color: var(--ink-3); }
.defs dd { margin: 0; color: var(--ink); }

/* Timeline ----------------------------------------------------------------- */
.timeline { position: relative; padding-left: 22px; display: flex; flex-direction: column; gap: 15px; }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: 5px; bottom: 5px;
  width: 1.5px; background: var(--border);
}
.tl-item { position: relative; font-size: 13px; }
.tl-item::before {
  content: ""; position: absolute; left: -22px; top: 4px;
  width: 11px; height: 11px; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--border-strong);
}
.tl-item.ok::before     { border-color: var(--ok); background: var(--ok); box-shadow: 0 0 0 2px var(--ok-tint); }
.tl-item.brand::before  { border-color: var(--brand); background: var(--brand); box-shadow: 0 0 0 2px var(--brand-tint); }

.tl-item .t { font-size: 11.5px; color: var(--ink-4); margin-top: 1px; }

.shot .cap { padding: 8px 11px; border-top: 1px solid var(--border); background: var(--surface); font-size: 12px; }

.qa {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer; width: 100%;

  transition: border-color .12s ease, background .12s ease;
}
.qa:hover { border-color: var(--brand-line); background: var(--brand-tint); }
.qa .qi {
  width: 30px; height: 30px; border-radius: var(--r); flex: none;
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--ink-2);
}
.qa:hover .qi { background: #fff; color: var(--brand-press); }
.qa .qi svg { width: 15px; height: 15px; }
.qa .qt { font-size: 13.5px; font-weight: 500; }
.qa .qs { font-size: 11.5px; color: var(--ink-3); }

/* Skeletons ---------------------------------------------------------------- */
.sk {
  background: linear-gradient(90deg, var(--surface-3) 25%, #EDEDEF 37%, var(--surface-3) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.3s ease-in-out infinite;
  border-radius: var(--r-sm);
  height: 12px;
}
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* Empty state -------------------------------------------------------------- */
.empty { display: grid; place-items: center; gap: 5px; padding: 52px 24px; text-align: center; }
.empty .ei {
  width: 40px; height: 40px; border-radius: var(--r-md);
  display: grid; place-items: center; margin-bottom: 7px;
  background: var(--surface-3); color: var(--ink-4);
}
.empty .ei svg { width: 19px; height: 19px; }
.empty h3 { font-size: 14.5px; }
.empty p { font-size: 13px; color: var(--ink-3); max-width: 330px; }

/* Discord preview ---------------------------------------------------------- */
.dc {
  background: #313338; border-radius: var(--r-md); padding: 14px 16px;
  color: #DBDEE1; font-size: 13.5px; line-height: 1.5;
}
.dc-msg { display: flex; gap: 11px; }
.dc-av {
  width: 34px; height: 34px; border-radius: 999px; flex: none;
  background: var(--brand); display: grid; place-items: center;
}
.dc-av svg { width: 17px; height: 17px; color: #fff; }
.dc-name { color: #fff; font-weight: 600; font-size: 13.5px; }
.dc-tag {

  border-radius: 4px; padding: 1px 4px; margin-left: 5px; letter-spacing: .01em;
}
.dc-time { color: #949BA4; font-size: 11.5px; margin-left: 6px; }
.dc-embed {
  border-left: 4px solid var(--ok); background: #2B2D31;

.dc-embed.brand  { border-left-color: var(--brand); }
.dc-embed.warn   { border-left-color: var(--warn); }
.dc-embed.danger { border-left-color: var(--danger); }
.dc-embed h4 { color: #fff; font-size: 14px; margin-bottom: 6px; }
.dc-fields { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px 14px; margin-top: 10px; }
.dc-f .k { color: #B5BAC1; font-size: 11.5px; font-weight: 600; }
.dc-f .v { color: #DBDEE1; font-size: 13px; }
.dc-foot { color: #949BA4; font-size: 11.5px; margin-top: 11px; }
.dc-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.dc-btn {

.dc-btn.primary { background: var(--brand); }
.dc-btn.danger  { background: #DA373C; }
.dc-btn.ok      { background: #248046; }

.signin-card { width: 100%; max-width: 400px; }

.menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

/* --- Menus and toasts ---------------------------------------------------- */
let openMenu = null;

function showMenu(anchor, items) {
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu';
  el.innerHTML = items.map((it) => it === '-'
    ? '<hr>'
    : `<button data-act="${it.act}" ${it.id ? `data-id="${it.id}"` : ''} ${it.kind ? `data-kind="${it.kind}"` : ''} class="${it.danger ? 'danger' : ''}">${icons[it.icon] ?? ''}${esc(it.label)}</button>`).join('');
  document.body.appendChild(el);

  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth;
  el.style.top = `${Math.min(r.bottom + 6, window.innerHeight - el.offsetHeight - 10)}px`;
  el.style.left = `${Math.max(10, Math.min(r.right - w, window.innerWidth - w - 10))}px`;
  openMenu = el;
}

function closeMenu() {
  openMenu?.remove();
  openMenu = null;
}

function toast(message, ok = true) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="${ok ? 'ok' : ''}" style="width:15px;height:15px;display:block">${ok ? icons.check : icons.alert}</span><span>${esc(message)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* --- Overlay plumbing ---------------------------------------------------- */
let overlay = null;

function openOverlay(html, opts = {}) {
  overlay = opts.name ?? 'overlay';
  $('#overlays').innerHTML = html.trim().startsWith('<div class="panel-scrim"')
    ? html
    : `<div class="scrim ${opts.center ? 'center' : ''}" data-scrim>${html}</div>`;
  document.body.style.overflow = 'hidden';
  const focusable = $('#overlays').querySelector('input, textarea, button.primary');
  focusable?.focus?.();
}

function closeOverlay() {
  overlay = null;
  $('#overlays').innerHTML = '';
  document.body.style.overflow = '';
}

    root.innerHTML = signIn();

  }

  root.innerHTML = h`
    <div class="app">
      ${sidebar()}

/* --- Events -------------------------------------------------------------- */
document.addEventListener('click', (e) => {
  const menuBtn = e.target.closest('.menu button');
  const trigger = e.target.closest('[data-act]');

  if (!trigger && openMenu && !e.target.closest('.menu')) closeMenu();

  if (e.target.closest('[data-scrim]') && !e.target.closest('.modal')) {
    closeOverlay();
    return;
  }

  if (!trigger) return;

  const act = trigger.dataset.act;
  const id = trigger.dataset.id;
  const kind = trigger.dataset.kind;

  if (menuBtn) closeMenu();

  switch (act) {
    case 'do-signin':
      state.signedIn = true;
      render();
      toast('Signed in as Kaeden Vaughns');
      break;

    case 'signout':
      state.signedIn = false;
      state.drawer = false;
      closeOverlay();
      render();
      break;

    case 'goto':
      state.page = trigger.dataset.page;
      state.agentId = null;
      state.drawer = false;
      closeOverlay();
      render();
      window.scrollTo({ top: 0 });
      break;

    case 'drawer':
      state.drawer = !state.drawer;
      render();
      break;

    case 'new-request':
      openOverlay(newRequestStep1(), { name: 'new' });
      break;

    case 'fill-example': {
      const input = $('#reqInput');
      if (input) { input.value = EXAMPLE; input.focus(); }
      break;
    }

    case 'interpret': {
      const value = ($('#reqInput')?.value ?? '').trim();
      const btn = $('#interpretBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Reading that…'; }
      // A short pause so the interpreting step is visible rather than a jump.
      setTimeout(() => {
        // The example names a campaign but no username or license type, so it
        // takes the missing-information path — the honest outcome.
        openOverlay(value && !/username/i.test(value) ? newRequestMissing() : newRequestConfirm(), { name: 'confirm' });
      }, 420);
      break;
    }

    case 'quick':
      if (kind === 'create') { openOverlay(newRequestMissing(), { name: 'missing' }); break; }
      if (kind === 'usage' || kind === 'status') {
        closeOverlay();
        state.page = kind === 'usage' ? 'licenses' : 'agents';
        state.agentId = null;
        render();
        toast(kind === 'usage' ? 'Checked license usage' : 'Pick an agent to look up');
        break;
      }
      openOverlay(confirmModal(kind === 'clear' ? 'clear' : kind === 'reset' ? 'reset' : 'deactivate', '1001'), { name: 'confirm' });
      break;

    case 'confirm-step':
      openOverlay(newRequestConfirm(), { name: 'confirm' });
      break;

    case 'run-request':
      openOverlay(newRequestRunning(), { name: 'running' });
      setTimeout(() => openOverlay(newRequestDone(), { name: 'done' }), 2100);
      break;

    case 'confirm-action':
      closeMenu();
      openOverlay(confirmModal(kind, id), { name: 'confirm', center: true });
      break;

    case 'run-confirm': {
      const btn = trigger;
      btn.disabled = true;
      btn.textContent = 'Working…';
      setTimeout(() => {
        closeOverlay();
        toast('Request submitted — you will see the result here and in Discord');
      }, 900);
      break;
    }

    case 'approve-deactivate':
      closeOverlay();
      toast('Deactivation approved and queued as RS-1046');
      break;

    case 'clear-inactive':
      openOverlay(clearInactiveModal(), { name: 'bulk' });
      break;

    case 'invite':
      openOverlay(inviteModal(), { name: 'invite', center: true });
      break;

    case 'login-required':
      openOverlay(loginRequiredModal(), { name: 'login', center: true });
      break;

    case 'reconnect': {
      const btn = trigger;
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      setTimeout(() => {
        state.demo = 'normal';
        closeOverlay();
        render();
        toast('Signed back in — 2 waiting requests have resumed');
      }, 1200);
      break;
    }

    case 'test-connection': {
      const btn = trigger;
      btn.disabled = true;
      btn.textContent = 'Checking…';
      setTimeout(() => { render(); toast('Readymode responded in 0.9 seconds'); }, 900);
      break;
    }

    case 'open-request':
      closeOverlay();
      openOverlay(requestPanel(Number(id)), { name: 'request' });
      break;

    case 'open-agent':
      state.page = 'agents';
      state.agentId = id;
      render();
      window.scrollTo({ top: 0 });
      break;

    case 'row-menu':
      e.stopPropagation();
      showMenu(trigger, [
        { act: 'open-request', id, icon: 'external', label: 'Open request' },
        { act: 'noop', icon: 'file', label: 'Copy request ID' },
        '-',
        { act: 'noop', icon: 'image', label: 'View evidence' },
      ]);
      break;

    case 'agent-menu':
      e.stopPropagation();
      showMenu(trigger, [
        { act: 'open-agent', id, icon: 'user', label: 'View agent' },
        { act: 'noop', icon: 'external', label: 'Open in Readymode' },
        '-',
        { act: 'confirm-action', kind: 'clear', id, icon: 'key', label: 'Clear license' },
        { act: 'confirm-action', kind: 'reset', id, icon: 'lock', label: 'Reset password' },
        '-',
        { act: 'confirm-action', kind: 'deactivate', id, icon: 'trash', label: 'Deactivate account', danger: true },
      ]);
      break;

    case 'team-menu':
      e.stopPropagation();
      showMenu(trigger, [
        { act: 'noop', icon: 'user', label: 'Change role' },
        { act: 'noop', icon: 'bell', label: 'Alert preferences' },
        '-',
        { act: 'noop', icon: 'trash', label: 'Remove access', danger: true },
      ]);
      break;

    case 'settings-section':
      settingsSection = trigger.dataset.key;
      render();
      break;

    case 'save-settings':
      trigger.disabled = true;
      trigger.textContent = 'Saving…';
      setTimeout(() => { render(); toast('Settings saved'); }, 700);
      break;

    case 'clear-filters':
      state.filters = { status: 'all', action: 'all', by: 'all', q: '' };
      render();
      break;

    case 'retry-load':
      state.demo = 'normal';
      render();
      break;

    case 'toggle': {
      const on = trigger.getAttribute('aria-checked') === 'true';
      trigger.setAttribute('aria-checked', String(!on));
      break;
    }

    case 'close-overlay':
      closeOverlay();
      break;

    case 'noop':
      break;
  }
});

/* Typed confirmation for deactivation. */
document.addEventListener('input', (e) => {
  if (e.target.id === 'typed') {
    const btn = $('#confirmBtn');
    if (btn) btn.disabled = e.target.value.trim().length < 3;
  }
  if (e.target.id === 'reqSearch') { state.filters.q = e.target.value; renderKeepingFocus('reqSearch'); }
  if (e.target.id === 'agentSearch') { state.agentQuery = e.target.value; renderKeepingFocus('agentSearch'); }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'demoState') { state.demo = e.target.value; closeOverlay(); render(); return; }
  if (e.target.id === 'fStatus')  { state.filters.status = e.target.value; render(); }
  if (e.target.id === 'fAction')  { state.filters.action = e.target.value; render(); }
  if (e.target.id === 'fBy')      { state.filters.by = e.target.value; render(); }
});

/* Re-render without losing the caret in a search field. */
function renderKeepingFocus(inputId) {
  const before = document.getElementById(inputId);
  const pos = before?.selectionStart ?? 0;
  render();
  const after = document.getElementById(inputId);
  if (after) { after.focus(); after.setSelectionRange(pos, pos); }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (openMenu) { closeMenu(); return; }
    if (overlay) { closeOverlay(); return; }
    if (state.drawer) { state.drawer = false; render(); }
  }
  // The fastest path to the thing this product exists for.
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && state.signedIn) {
    e.preventDefault();
    openOverlay(newRequestStep1(), { name: 'new' });
  }
});

window.addEventListener('resize', () => { if (window.innerWidth > 860 && state.drawer) { state.drawer = false; render(); } });

render();

</script>
